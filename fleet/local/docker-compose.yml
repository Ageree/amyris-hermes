# =============================================================================
# fleet/local/docker-compose.yml — two-tenant local smoke harness
#
# Proves the core M6 invariant OFFLINE, against the REAL worker (lab/skeleton):
#   "alice's worker only processes alice's messages and replies to alice's
#    address; bob's worker only processes bob's messages and replies to bob's
#    address — ZERO cross-contamination."
#
# Architecture
# ------------
#   mock_outbound — fake Convex HTTP API (/api/mutation,/api/query) + fake MiniMax
#                   chat (/v1/chat/completions) + outbound reply sink + validator
#   worker_alice  — real scoped worker container (USER_ID=u_alice)
#   worker_bob    — real scoped worker container (USER_ID=u_bob)
#   seed          — enqueues one msg per tenant, polls /status, asserts, exits
#
# How the workers produce a reply WITHOUT Hermes:
#   The image has no Hermes, so we drive the FAST LANE pointed at mock_outbound:
#     FAST_LANE_ENABLED=1, MINIMAX_API_KEY=mock-key,
#     MINIMAX_BASE_URL=http://mock_outbound:8800/v1, MINIMAX_MODEL=MiniMax-M3
#   mock_outbound's /v1/chat/completions returns a plain "ok, handled." reply, so
#   fast_reply returns it (no defer) and the worker calls messages:complete.
#   STREAMING_ENABLED=0 so the worker uses the non-streaming JSON chat path.
#
# Usage
# -----
#   cd fleet/local
#   docker compose up --build --abort-on-container-exit --exit-code-from seed
#   docker compose logs mock_outbound | grep -E 'alice->alice|bob->bob'
#   docker compose down -v
#
# Secrets: copy .env.example to .env (placeholder values work for offline mode).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # mock_outbound — fake Convex + fake model + outbound sink + validator
  # ---------------------------------------------------------------------------
  mock_outbound:
    image: python:3.12-slim
    command: python /app/mock_outbound.py
    volumes:
      - ./mock_outbound.py:/app/mock_outbound.py:ro
    environment:
      MOCK_HOST: "0.0.0.0"
      MOCK_PORT: "8800"
      WORKER_SECRET: "${WORKER_SECRET:-test-secret}"
      PYTHONUNBUFFERED: "1"
    ports:
      - "8800:8800"
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8800/health')"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s

  # ---------------------------------------------------------------------------
  # worker_alice — scoped to u_alice; must only claim/reply to alice's rows
  # ---------------------------------------------------------------------------
  worker_alice:
    build:
      context: ../..          # repo root so Dockerfile can COPY lab/skeleton/
      dockerfile: lab/docker/Dockerfile.fleet
      args:
        INSTALL_HERMES: "0"   # offline build: skip Hermes clone + Chromium
    environment:
      # --- Fleet scoping: this container is pinned to ONE tenant -------------
      WORKER_MODE: "scoped"
      USER_ID: "u_alice"
      INSTANCE_ID: "local-alice-001"
      # --- Mock Convex (mock_outbound speaks the real /api/mutation protocol)-
      CONVEX_URL: "http://mock_outbound:8800"
      WORKER_SECRET: "${WORKER_SECRET:-test-secret}"
      # --- Fast lane pointed at the mock model so the worker can reply -------
      FAST_LANE_ENABLED: "1"
      MINIMAX_API_KEY: "mock-key"
      MINIMAX_BASE_URL: "http://mock_outbound:8800/v1"
      MINIMAX_MODEL: "MiniMax-M3"
      STREAMING_ENABLED: "0"        # use non-streaming JSON chat path
      MEDIUM_LANE_ENABLED: "0"      # one shot, no second model call
      HISTORY_ENABLED: "0"          # no conversation history in the mock
      QUOTA_ENABLED: "0"            # no quota gate in offline mode
      TYPING_ENABLED: "0"           # typing indicator would hit the channel
      MULTI_BUBBLE_ENABLED: "1"
      # --- Shared channel creds (placeholders; never actually called) --------
      SENDBLUE_API_KEY_ID: "${SENDBLUE_API_KEY_ID:-placeholder-key-id}"
      SENDBLUE_API_SECRET_KEY: "${SENDBLUE_API_SECRET_KEY:-placeholder-secret}"
      SENDBLUE_FROM_NUMBER: "${SENDBLUE_FROM_NUMBER:-+10000000000}"
      TELEGRAM_BOT_TOKEN: ""        # iMessage-only in the local harness
      EXA_API_KEY: "${EXA_API_KEY:-}"
      # --- Hermes runtime (absent in offline mode; never invoked) ------------
      HERMES_HOME: "/hermes-home"
      HERMES_DIR: "/hermes-home"
      HERMES_PYTHON_BIN: "/usr/bin/python3"
      # Legacy fallback only; scoped mode routes by the claimed row's replyTarget.
      ALLOWED_USER_NUMBER: "+1alice555"
      POLL_INTERVAL: "0.5"
      IDLE_POLL_INTERVAL: "1.0"
      PYTHONUNBUFFERED: "1"
    volumes:
      - alice_hermes_home:/hermes-home
    depends_on:
      mock_outbound:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # worker_bob — scoped to u_bob; must only claim/reply to bob's rows
  # ---------------------------------------------------------------------------
  worker_bob:
    build:
      context: ../..
      dockerfile: lab/docker/Dockerfile.fleet
      args:
        INSTALL_HERMES: "0"
    environment:
      WORKER_MODE: "scoped"
      USER_ID: "u_bob"
      INSTANCE_ID: "local-bob-001"
      CONVEX_URL: "http://mock_outbound:8800"
      WORKER_SECRET: "${WORKER_SECRET:-test-secret}"
      FAST_LANE_ENABLED: "1"
      MINIMAX_API_KEY: "mock-key"
      MINIMAX_BASE_URL: "http://mock_outbound:8800/v1"
      MINIMAX_MODEL: "MiniMax-M3"
      STREAMING_ENABLED: "0"
      MEDIUM_LANE_ENABLED: "0"
      HISTORY_ENABLED: "0"
      QUOTA_ENABLED: "0"
      TYPING_ENABLED: "0"
      MULTI_BUBBLE_ENABLED: "1"
      SENDBLUE_API_KEY_ID: "${SENDBLUE_API_KEY_ID:-placeholder-key-id}"
      SENDBLUE_API_SECRET_KEY: "${SENDBLUE_API_SECRET_KEY:-placeholder-secret}"
      SENDBLUE_FROM_NUMBER: "${SENDBLUE_FROM_NUMBER:-+10000000000}"
      TELEGRAM_BOT_TOKEN: ""
      EXA_API_KEY: "${EXA_API_KEY:-}"
      HERMES_HOME: "/hermes-home"
      HERMES_DIR: "/hermes-home"
      HERMES_PYTHON_BIN: "/usr/bin/python3"
      ALLOWED_USER_NUMBER: "+1bob999"
      POLL_INTERVAL: "0.5"
      IDLE_POLL_INTERVAL: "1.0"
      PYTHONUNBUFFERED: "1"
    volumes:
      - bob_hermes_home:/hermes-home
    depends_on:
      mock_outbound:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # seed — enqueues one msg per tenant, polls /status until both done, asserts,
  # exits with the routing result. --exit-code-from seed propagates it.
  # ---------------------------------------------------------------------------
  seed:
    image: python:3.12-slim
    command: python /app/seed.py
    volumes:
      - ./seed.py:/app/seed.py:ro
    environment:
      MOCK_HOST: "mock_outbound"
      MOCK_PORT: "8800"
      WORKER_SECRET: "${WORKER_SECRET:-test-secret}"
      SEED_TIMEOUT: "90"
      PYTHONUNBUFFERED: "1"
    depends_on:
      mock_outbound:
        condition: service_healthy
      worker_alice:
        condition: service_started
      worker_bob:
        condition: service_started
    restart: "no"

# ---------------------------------------------------------------------------
# Named volumes — one per tenant; isolated, writable, never shared.
# ---------------------------------------------------------------------------
volumes:
  alice_hermes_home:
  bob_hermes_home:
