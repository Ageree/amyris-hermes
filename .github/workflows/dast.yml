name: DAST

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Staging or preview URL to scan"
        required: true
        type: string
  schedule:
    - cron: "17 5 * * 2"

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DAST_TARGET_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "url=${{ inputs.target_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ vars.DAST_TARGET_URL }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -m 5"
