[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-config --strict-markers --durations=20
markers =
    unit: fast, network-free unit test (CI default)
    convex_e2e: requires a real dev Convex deployment (run with RUN_CONVEX_E2E=1)
    live_channel: requires a real channel send — Sendblue/Telegram (run with RUN_LIVE_CHANNEL=1)
